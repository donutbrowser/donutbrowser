name: Spell Check

permissions:
  contents: read

# Pushes to main reach this through rolling-release.yml and tags through
# release.yml. A push trigger of its own ran it twice for each push to main.
on:
  workflow_call: {}
  pull_request:
    branches: ["main"]

concurrency:
  # A called workflow sees its caller's `github.workflow`, so the literal
  # prefix keeps this group apart from the caller's own.
  group: spellcheck-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Spell Check Repo
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

# Installs Node.js dependencies and pnpm, and checks formatting + linting

name: Lint Node.js

# Called only: pr-checks.yml runs it for pull requests and merge groups,
# rolling-release.yml for pushes to main and release.yml for tags. A push
# trigger of its own ran every job a second time for each push to main.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    # biome and tsrs do not depend on the host. Linux starts faster than macOS
    # and leaves the five-runner macOS pool to the Rust and release builds.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm package manager
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 #v6.1.1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run lint step
        run: pnpm run lint:js

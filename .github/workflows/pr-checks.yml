name: Pull Request Checks

on:
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

permissions:
  contents: read

# A new push to a pull request makes the previous run's results moot.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which suites this pull request can affect. Anything unrecognised
  # runs everything, so a new directory is covered until it is listed here.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
      deps: ${{ steps.filter.outputs.deps }}
      ci: ${{ steps.filter.outputs.ci }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Checkout repository code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base branch tip.
          fetch-depth: 2

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          all() {
            {
              echo "js=true"
              echo "rust=true"
              echo "deps=true"
              echo "ci=true"
              echo "sdk=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT_NAME" = "pull_request" ] || all
          git diff --name-only HEAD^1 HEAD > /tmp/changed.txt || all
          [ -s /tmp/changed.txt ] || all

          js=false; rust=false; deps=false; ci=false; sdk=false
          while IFS= read -r file; do
            case "$file" in
              # Text and tooling the lint and test jobs never read.
              *.md|LICENSE|.github/ISSUE_TEMPLATE/*|\
              .github/prompts/*|.github/codeql/*|.github/actions/*|_typos.toml|assets/*|\
              flake.nix|flake.lock|packaging/*|snap/*|.vscode/*|.envrc|osv-scanner.toml)
                ;;
              sdk/*)
                sdk=true ;;
              .github/scripts/*|.github/zizmor.yml)
                ci=true ;;
              # Every workflow is linted. Only the ones this check calls also
              # run the suites.
              .github/workflows/*)
                ci=true
                case "$file" in
                  .github/workflows/pr-checks.yml|.github/workflows/lint-js.yml|.github/workflows/lint-rs.yml)
                    js=true; rust=true ;;
                  .github/workflows/test-sdk.yml)
                    sdk=true ;;
                esac
                ;;
              # Templates and other repository settings no job reads.
              .github/*)
                ;;
              # Rust only. The .mjs helpers under src-tauri are linted by biome.
              src-tauri/*.mjs)
                js=true; rust=true ;;
              # Workflows run this script on issue and pull request text.
              scripts/redact-sensitive-text.mjs)
                js=true; rust=true; ci=true ;;
              src-tauri/*|donut-sync/*)
                rust=true ;;
              *)
                js=true; rust=true ;;
            esac
            case "$file" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|donut-sync/Cargo.toml|donut-sync/Cargo.lock|\
              src-tauri/Cargo.toml|src-tauri/Cargo.lock|osv-scanner.toml|.github/workflows/pr-checks.yml)
                deps=true ;;
            esac
          done < /tmp/changed.txt

          {
            echo "js=$js"
            echo "rust=$rust"
            echo "deps=$deps"
            echo "ci=$ci"
            echo "sdk=$sdk"
          } >> "$GITHUB_OUTPUT"
          echo "Changed files: $(wc -l < /tmp/changed.txt); js=$js rust=$rust deps=$deps ci=$ci sdk=$sdk"

  lint-js:
    name: Lint JavaScript/TypeScript
    needs: changes
    if: needs.changes.outputs.js == 'true'
    uses: ./.github/workflows/lint-js.yml
    permissions:
      contents: read

  lint-rust:
    name: Lint Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/lint-rs.yml
    permissions:
      contents: read

  lint-workflows:
    name: Lint Workflows
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/lint-workflows.yml
    permissions:
      contents: read

  test-sdk:
    name: Test SDKs
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    uses: ./.github/workflows/test-sdk.yml
    permissions:
      contents: read

  # Reports only vulnerabilities a pull request introduces, so it has nothing
  # to say unless a manifest or lockfile changed. osv.yml no longer runs this
  # scan a second time for the same pull request.
  security-scan:
    name: Security Vulnerability Scan
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      scan-args: |-
        -r
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml
        --lockfile=src-tauri/Cargo.lock
        --lockfile=donut-sync/Cargo.lock
        ./

  # E2E suites deliberately do not run here. They need real credentials, Docker,
  # and a desktop session, which CI could not supply reliably. They are run
  # locally instead; see the E2E section of AGENTS.md.

  # The one check to require in branch protection: it is green only when
  # every suite the change can affect passed.
  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint-js, lint-rust, lint-workflows, test-sdk, security-scan]
    if: always()
    steps:
      - name: Check all jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # `skipped` means the pull request cannot affect that suite.
          {
            echo "| Check | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and (.key == "changes" or .value.result != "skipped"))
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Checks that did not pass: $(tr '\n' ' ' <<< "$failed")"
            exit 1
          fi
          echo "All checks passed"
